name: Verify mobile manipulation simulation

on: [push, pull_request]

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run simulation and state integrator
        env:
          MPLBACKEND: Agg
        run: |
          python main.py
          python Nextstate.py
      - name: Check generated outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np

          for name in ('trajectory', 'overall_trajectory', 'state'):
              values = np.loadtxt(Path('data') / f'{name}.csv', delimiter=',')
              assert values.ndim == 2 and values.shape[1] == 13
              assert np.isfinite(values).all()
              print(f'{name}: {values.shape[0]} rows')
          assert Path('data/tracking-error.png').is_file()
          assert Path('data/jacobian-condition.png').is_file()
          PY
